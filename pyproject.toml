[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbj"
version = "0.1.0"
description = "A tiny object-oriented PB&J sandwich package for teaching Git/GitHub workflows."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Noah Franz", email = "nfranz@arizona.edu" }]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
make-pbj = "pbj.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
